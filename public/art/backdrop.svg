<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowA" cx="84%" cy="4%" r="62%">
      <stop offset="0" stop-color="#ff2e44" stop-opacity=".34"/>
      <stop offset=".38" stop-color="#9c1022" stop-opacity=".14"/>
      <stop offset="1" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="4%" cy="100%" r="55%">
      <stop offset="0" stop-color="#c0142c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="46%" cy="44%" r="40%">
      <stop offset="0" stop-color="#2a2a38" stop-opacity=".28"/>
      <stop offset="1" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".055"/>
    </pattern>
    <radialGradient id="dotFade" cx="62%" cy="18%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1600" height="1000" fill="url(#dotFade)"/></mask>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4655" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff4655" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff4655" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#08080a"/>
  <rect width="1600" height="1000" fill="url(#glowC)"/>
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <!-- Topographic rings around the glow, like a map of the arena. -->
  <g fill="none" stroke="#ff4655" stroke-width="1.2">
    <ellipse cx="1360" cy="90" rx="150" ry="96" transform="rotate(-16 1360 90)" stroke-opacity=".16"/>
    <ellipse cx="1350" cy="100" rx="245" ry="160" transform="rotate(-14 1350 100)" stroke-opacity=".12"/>
    <ellipse cx="1338" cy="112" rx="350" ry="232" transform="rotate(-12 1338 112)" stroke-opacity=".09"/>
    <ellipse cx="1324" cy="126" rx="470" ry="314" transform="rotate(-10 1324 126)" stroke-opacity=".065"/>
    <ellipse cx="1306" cy="142" rx="610" ry="410" transform="rotate(-8 1306 142)" stroke-opacity=".045"/>
    <ellipse cx="1286" cy="160" rx="770" ry="520" transform="rotate(-6 1286 160)" stroke-opacity=".03"/>
  </g>
  <g fill="none" stroke="#ff4655" stroke-width="1" stroke-dasharray="2 10" stroke-opacity=".18">
    <ellipse cx="1344" cy="106" rx="298" ry="196" transform="rotate(-13 1344 106)"/>
  </g>
  <!-- Two light streaks cutting across the corner. -->
  <path d="M960 -40 L1640 520" stroke="url(#streak)" stroke-width="1.4"/>
  <path d="M1180 -40 L1640 340" stroke="url(#streak)" stroke-width="1" stroke-opacity=".7"/>
  <!-- Corner ticks. -->
  <g stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5" fill="none">
    <path d="M40 72 V40 H72"/>
    <path d="M1560 928 V960 H1528"/>
  </g>
</svg>
